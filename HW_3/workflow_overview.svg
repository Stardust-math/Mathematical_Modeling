<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Overall workflow of HW 3 curve fitting project</title>
  <desc id="desc">A horizontal flowchart showing data input, parameterization, interpolation and approximation methods, Fourier reconstruction, evaluation, and website outputs.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f7f9fc; stroke: #44506a; stroke-width: 2; rx: 22; ry: 22; }
      .box2 { fill: #eef3ff; stroke: #405a9a; stroke-width: 2; rx: 22; ry: 22; }
      .box3 { fill: #eefaf4; stroke: #2f7a55; stroke-width: 2; rx: 22; ry: 22; }
      .box4 { fill: #fff7ec; stroke: #b8731f; stroke-width: 2; rx: 22; ry: 22; }
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #1f2a44; }
      .text { font: 500 19px Arial, Helvetica, sans-serif; fill: #28344c; }
      .small { font: 500 17px Arial, Helvetica, sans-serif; fill: #32415f; }
      .arrow { stroke: #5a6785; stroke-width: 3; fill: none; marker-end: url(#m); }
      .dashed { stroke-dasharray: 10 8; }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6785"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="460"/>

  <text class="title" x="70" y="55">Overall workflow and method organization</text>

  <rect class="box" x="50" y="120" width="210" height="120"/>
  <text class="title" x="88" y="165">Input points</text>
  <text class="text" x="88" y="200">Scattered planar</text>
  <text class="text" x="88" y="228">samples on curves</text>

  <rect class="box2" x="320" y="90" width="240" height="170"/>
  <text class="title" x="352" y="135">Parameterization</text>
  <text class="small" x="352" y="172">• uniform</text>
  <text class="small" x="352" y="202">• chord-length</text>
  <text class="small" x="352" y="232">• Foley-type / curvature-aware</text>

  <rect class="box3" x="620" y="55" width="340" height="240"/>
  <text class="title" x="650" y="100">Interpolation and approximation</text>
  <text class="small" x="650" y="142">• cubic Hermite interpolation</text>
  <text class="small" x="650" y="176">• cubic B-spline interpolation</text>
  <text class="small" x="650" y="210">• polynomial least-squares fitting</text>
  <text class="small" x="650" y="244">• B-spline least-squares fitting</text>

  <rect class="box4" x="1020" y="55" width="300" height="240"/>
  <text class="title" x="1060" y="100">Evaluation</text>
  <text class="small" x="1060" y="142">• Chamfer distance</text>
  <text class="small" x="1060" y="176">• average point-to-curve distance</text>
  <text class="small" x="1060" y="210">• Hausdorff distance</text>
  <text class="small" x="1060" y="244">• runtime and visual comparison</text>

  <rect class="box2" x="620" y="330" width="340" height="90"/>
  <text class="title" x="685" y="370">Periodic Fourier branch</text>
  <text class="small" x="685" y="400">closed contours, harmonic truncation, epicycles</text>

  <rect class="box" x="1380" y="120" width="180" height="120"/>
  <text class="title" x="1420" y="165">Outputs</text>
  <text class="small" x="1410" y="198">SVG figures, GIFs,</text>
  <text class="small" x="1410" y="225">GUI, PDF report</text>

  <path class="arrow" d="M 260 180 H 320"/>
  <path class="arrow" d="M 560 175 H 620"/>
  <path class="arrow" d="M 960 175 H 1020"/>
  <path class="arrow" d="M 1320 180 H 1380"/>

  <path class="arrow dashed" d="M 440 260 V 375 H 620"/>
  <path class="arrow dashed" d="M 960 375 H 1170 V 240"/>

  <text class="small" x="438" y="286">same samples can also enter the periodic closed-curve branch</text>
</svg>
